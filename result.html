<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Результат — Бизнесмен на день</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="app">
        <!-- ХЕАДЕР С ИЗОБРАЖЕНИЕМ -->
        <div class="header">
            <img src="img/header-bg.jpg" alt="Бизнесмен на день" />
        </div>

        <div class="content" id="resultContent">
            <div class="result-card">
                <!-- ИЗОБРАЖЕНИЕ ТИПАЖА (увеличено в 1.7 раза, обводка тоньше) -->
                <div id="resultImage"></div>

                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:300; color:#7a7266;">Ваш типаж</span>
                    <span class="badge-result" id="resultBadge">⭐</span>
                </div>
                <div class="result-type" id="resultType">Бизнесмен-визионер</div>
                <div class="result-desc" id="resultDesc">Описание типажа</div>
                <div style="margin-top:14px;">
                    <i class="fas fa-coins" style="color:#DE1A1A;"></i>
                    <span id="resultBalance">500 000 ₽</span>
                </div>
            </div>

            <h4 style="margin:6px 0 4px;">📋 Ваш выбор по лотам</h4>
            <table class="lot-table">
                <thead><tr><th>Лот</th><th>Решение</th></tr></thead>
                <tbody id="resultTableBody"></tbody>
            </table>

            <div class="finish-cta">
                🏁 Беги за призом в шатёр РЖД «Управление имуществом»!
            </div>

            <!-- Вместо кнопки шеринга — простая фраза -->
            <div class="result-share-text">
                📸 Делайте скриншот и делитесь результатом с друзьями!
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initResultPage();
        });
    </script>
</body>
</html>
